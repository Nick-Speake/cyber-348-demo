
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #263447;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #394b61;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        footer {
            background-color: #263447;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Nicholas Speake's Website!</h1>
        <p>A simple HTML webpage</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome! This is a basic webpage built using HTML and CSS.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This section contains information about the website.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <ul>
                <li>Web Development</li>
                <li>Programming</li>
                <li>Learning HTML and CSS</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My First Website</p>
    </footer>

</body>
</html>
